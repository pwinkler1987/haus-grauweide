<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Das Haus Grauweide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="game">
    <div id="scene-wrap">
      <canvas id="scene" width="320" height="144"></canvas>
      <div id="speech" hidden></div>
      <div id="narration" hidden><p></p><span class="hint">▼ Klick</span></div>
      <div id="toast" hidden></div>
      <div id="chooser" hidden></div>
      <div id="codelock" hidden></div>
      <div id="ending" hidden></div>
      <div id="menu" hidden></div>
      <div id="title">
        <h1>Das Haus Grauweide</h1>
        <p>Ein Spukhaus-Mysterium</p>
        <p class="blink">Klicken zum Starten</p>
        <button id="continue" hidden>Spielstand laden</button>
      </div>
      <button id="menu-btn" aria-label="Menü">☰</button>
    </div>
    <div id="sentence">&nbsp;</div>
    <div id="panel">
      <div id="verbs"></div>
      <div id="inventory"></div>
    </div>
    <div id="dialog" hidden></div>
    <div id="party"></div>
    <div id="statusbar">
      <span id="room-name"></span>
      <span class="keys">1–9 Verben · Tab Figur wechseln · H Hotspots · Rechtsklick: Standardaktion · F5 Speichern · F9 Laden</span>
    </div>
  </main>
  <div id="rotate">Bitte das Gerät quer halten.</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
